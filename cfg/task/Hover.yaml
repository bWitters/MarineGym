name: Hover

defaults:
  # see https://hydra.cc/docs/advanced/overriding_packages/
  - /base/env_base@_here_
  - /base/sim_base@_here_
  - randomization@_here_ # Include the randomization settings
  - disturbances@_here_ # Include the disturbance settings

env:
  num_envs: 1
  env_spacing: 6
  max_episode_length: 200

drone_model:
  name: BlueROV
  controller: LeePositionController
force_sensor: false
time_encoding: true

reward_effort_weight: 0.1
reward_action_smoothness_weight: 0.0
reward_distance_scale: 1.2

action_transform: null

camera:
  enabled: true
  resolution: [84, 84] # [width, height]
  data_types: [rgb, distance_to_image_plane]
  translation: [0.20, 0.0, 0.03]
  target: [1.0, 0.0, 0.03] # local +X is the expected forward direction
  focal_length: 24.0
  horizontal_aperture: 20.955
  clipping_range: [0.1, 20.0]
  decimation: 1

slam:
  enabled: true
  map_size: [100, 100]  # cells
  resolution: 0.1      # meters per cell
  n_channels: 32